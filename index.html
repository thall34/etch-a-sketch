    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1 class="title">Etch-A-Sketch</h1>

    <div class="sketchpad">

        </div>
    </div>

    </footer>

    <script src="etchSketch.js"></script>
